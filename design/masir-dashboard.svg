  <title id="title">ماکاپ داشبورد بازی مسیر ثروت</title>
  <desc id="desc">نمای راست‌چین بازی راهبردی مالی با نقشهٔ وکتوری ۲.۵ بعدی، وضعیت مالی، بازار و فرم سفارش.</desc>
