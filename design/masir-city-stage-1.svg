<svg xmlns="http://www.w3.org/2000/svg" width="430" height="932" viewBox="0 0 430 932" role="img" aria-labelledby="title desc" direction="ltr" fill="#1e293b">
  <title id="title">مسیر ثروت — مرحلهٔ اول، شهر زنده</title>
  <desc id="desc">طرح مفهومی بازی شهرسازی و راهبرد مالی موبایلی با شهر ایزومتریک، ساختمان‌های تعاملی، ماشین و کاراکتر متحرک، و HUD کم‌حجم.</desc>
  <defs>
    <pattern id="grassGrid" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="skewY(-30)">
          <path d="M46 0H0V46" fill="none" stroke="#f8fafc" stroke-width="1" opacity=".055"/>
    </pattern>
    <style>
      text{font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;paint-order:stroke;stroke-linejoin:round}
      .ink{stroke:#1e293b;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
      .thin{stroke:#1e293b;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
      
      .white{fill:#f8fafc}.muted{fill:#dbeafe}.gold{fill:#f59e0b}
      .tiny{font-size:10px}.small{font-size:12px}.med{font-size:14px}.head{font-size:17px;font-weight:800}
      .car{animation:drive 8s linear infinite}.car2{animation:driveback 10s linear infinite}.smoke{animation:puff 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.walker{animation:walk 1.1s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center bottom}
      @keyframes drive{from{transform:translateX(-125px)}to{transform:translateX(470px)}}
      @keyframes driveback{from{transform:translateX(455px)}to{transform:translateX(-110px)}}
      @keyframes puff{0%{opacity:0;transform:translateY(4px) scale(.7)}25%{opacity:.72}100%{opacity:0;transform:translateY(-18px) scale(1.3)}}
      @keyframes walk{from{transform:translateY(0)}to{transform:translateY(-2px)}}
      @media(prefers-reduced-motion:reduce){.car,.car2,.smoke,.walker{animation:none}}
    </style>
  </defs>

